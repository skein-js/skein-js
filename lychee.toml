# Keep the link check deterministic enough for pull requests while still following redirects and
# retrying transient failures. CI persists `.lycheecache` between runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = [429, "500.."]
max_redirects = 10
max_retries = 3
retry_wait_time = 2
timeout = 20
include_fragments = "anchor-only"
exclude_loopback = true

# These hosts are intentionally illustrative, not resources readers should be able to open.
exclude = [
  '^https?://(?:[^/]+\.)?example\.(?:com|org|net)(?:/|$)',
  '^https?://[^/]+\.invalid(?:/|$)',
  # npmjs.com answers 403 to every non-browser client (bot protection), so the package links behind
  # the README version badges are unverifiable from CI however real they are. The badges themselves
  # are checked — they resolve against `img.shields.io`, which reads the registry — so a package that
  # vanished would still show up as a broken badge image rather than pass silently.
  '^https?://(?:www\.)?npmjs\.com/',
]

# Rules in `.github/workflows/docs-check.yml` need the absolute workspace path, which this file cannot
# interpolate. They resolve links to this repo's files against the working tree, and published page
# URLs against the freshly built HTML. This preserves VitePress's heading IDs, which can differ from
# lychee's Markdown slugs. Pages only updates after stable releases, so new pages and headings must
# be checked locally even after a pull request merges.
#
# That is a stricter check, not a looser one. Against GitHub those URLs answer for whatever is on
# `main`, so a pull request that *adds* a doc fails on links to the file it is adding, and — worse —
# one that *deletes* a doc still passes, because `main` has not caught up. Resolving locally fixes both
# directions. GitHub URLs carrying a fragment are left alone: `#readme` is a GitHub UI anchor, not
# something that resolves against a directory on disk.
#
# Two places where the docs are written for VitePress's resolution rather than the filesystem's, so
# lychee has to be told the same rules. These are *remaps*, not excludes, on purpose: the link is
# still checked, just against the path VitePress would serve it from. An image that vanished, or a
# card pointing at a page that no longer exists, still fails the build.
remap = [
  # Only the *first* matching rule applies, so this identity rule is a guard: README.md is read on
  # GitHub, not by VitePress, and already spells the path out as `docs/public/images/...`. Without
  # this, the rule below would match it too and prepend a second `docs/public`.
  'file://(.+)/docs/public/images/(.+) file://$1/docs/public/images/$2',
  # `docs/public/` is the VitePress public directory — it is served at the site root, so a page
  # references a screenshot as `/images/console/overview-light.png`. lychee resolves that against
  # `--root-dir` (the repo root) and looks for `<repo>/images/...`, which is nothing.
  'file://(.+)/images/(.+) file://$1/docs/public/images/$2',
  # `cleanUrls: true` means an in-page link is written extensionless — `./why#why-we-bet-on-langgraph`.
  # Markdown links can say `./why.md` and VitePress rewrites them, but these live in a raw HTML card
  # block, which it leaves alone, so extensionless is the only form that works on the site.
  'file://(.+)/docs/([a-z0-9-]+)#(.+) file://$1/docs/$2.md#$3',
]
