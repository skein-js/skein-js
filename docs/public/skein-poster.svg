<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">One skein-js runtime. Many agents built with LangGraph.js.</title>
  <desc id="desc">A solar-system illustration: skein-js is the central self-hosted server runtime, with support, research, and triage agents built with LangGraph.js on its orbits. It adds memory, streaming, approvals, scheduling, integrations, and a console.</desc>
