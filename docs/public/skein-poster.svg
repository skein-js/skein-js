    <radialGradient id="support" cx=".3" cy=".25"><stop stop-color="#b4b5ff"/><stop offset="1" stop-color="#5c6dd4"/></radialGradient>
    <radialGradient id="research" cx=".3" cy=".25"><stop stop-color="#b5f7e8"/><stop offset="1" stop-color="#239b9f"/></radialGradient>
    <radialGradient id="triage" cx=".3" cy=".25"><stop stop-color="#ffd6a0"/><stop offset="1" stop-color="#da7e5e"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="31"/></filter>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#f7fbff}.muted{fill:#b9d0e8}.mint{fill:#91f2dc}
