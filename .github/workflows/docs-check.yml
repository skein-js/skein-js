name: Docs check

# Check formatting, the VitePress build, and links for docs and code changes. Moving a package can
# break links without editing Markdown. Keep the repository metadata exclusions in sync with ci.yml.

on:
  push:
    branches: [main]
    paths-ignore: &docs-ignored-paths
      - ".gitignore"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/PULL_REQUEST_TEMPLATE/**"
  pull_request:
    paths-ignore: *docs-ignored-paths

concurrency:
  group: docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_LTS: 26

jobs:
  format-and-build:
    name: prettier · docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Match Pages: page timestamps and sitemap lastmod use git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      # Prettier covers the whole workspace, markdown included, so this is the formatting gate for a
      # docs-only change — ci.yml never sees one.
      - name: Prettier
        run: pnpm format:check

      # `docs` is an Nx project, so a broken link target or config change fails here rather than at
      # deploy time (docs.yml is called after the selected release publishes to npm).
      - name: Build and verify the docs site
        run: pnpm exec nx run docs:check-seo --output-style=stream

      - name: Upload built docs for link checking
        uses: actions/upload-artifact@v4
        with:
          name: docs-link-targets
          path: docs/.vitepress/dist
          if-no-files-found: error
          retention-days: 1

  links:
    name: docs links
    needs: format-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built docs for link checking
        uses: actions/download-artifact@v4
        with:
          name: docs-link-targets
          path: docs/.vitepress/dist

      - name: Restore link-check cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ hashFiles('lychee.toml', 'README.md', 'AGENTS.md', 'llms.txt', 'docs/**/*.md', 'skills/**/SKILL.md', '.agents/skills/**/SKILL.md', 'packages/*/README.md', 'examples/*/README.md') }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # Pages only updates after release publication. Check our page URLs against this checkout's
          # built HTML so unreleased pages work and fragments use VitePress's actual heading IDs.
          args: >-
            --root-dir ${{ github.workspace }}
            --config lychee.toml
            --remap '^https://skein[.]js[.]org/(#.*)?$ file://${{ github.workspace }}/docs/.vitepress/dist/index.html$1'
            --remap '^https://skein[.]js[.]org/(recipes|proposals)/?(#.*)?$ file://${{ github.workspace }}/docs/.vitepress/dist/$1/index.html$2'
            --remap '^https://skein[.]js[.]org/((?:[a-z0-9-]+/)*[a-z0-9-]+)(?:[.]html)?/?(#.*)?$ file://${{ github.workspace }}/docs/.vitepress/dist/$1.html$2'
            --remap '^https://skein[.]js[.]org/([^#]+[.](?:md|txt|xml|svg|png|webm))(#.*)?$ file://${{ github.workspace }}/docs/.vitepress/dist/$1$2'
            --remap 'https://github\.com/skein-js/skein-js/(?:blob|tree)/main/([^#]+)$ file://${{ github.workspace }}/$1'
            --no-progress
            README.md
            AGENTS.md
            llms.txt
            'docs/**/*.md'
            'skills/**/SKILL.md'
            '.agents/skills/**/SKILL.md'
            'packages/*/README.md'
            'examples/*/README.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}
