name: CI

# Everything here builds or exercises code, so a markdown-only change can't affect any of it. Those
# changes are covered by docs-check.yml instead, which runs on every push and holds the checks that a
# docs edit *can* break: Prettier, the VitePress build, and the link check.
#
# `paths-ignore` skips the run only when *every* changed file matches, so a commit touching code and
# docs together still runs in full. `workflow_call` takes no filter, so release.yml's gate is unaffected.
# The two lists are duplicated because GitHub Actions does not support YAML anchors — keep them in sync.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "llms.txt"
      - "llms-full.txt"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "llms.txt"
      - "llms-full.txt"
      - "LICENSE"
  # Callable by release.yml so a publish runs these exact checks on the released commit.
  workflow_call:

# A newer push to the same ref cancels an in-flight run — no point finishing stale checks.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 remains the default version `skein build` bakes into a production image.
  # Testing on an older major than we ship is how a whole phase of Bun/Deno image defects went unseen.
  NODE_LTS: 24

jobs:
  local-deployment:
    uses: ./.github/workflows/local-deployment.yml

  check:
    name: ${{ matrix.node == 24 && 'lint · typecheck · test · build' || 'lint · typecheck · test · build (Node 26)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node, so setup-node's pnpm store cache has a package manager to key on.
      # The version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache Nx's computation cache across runs so unchanged projects skip re-work.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-node-${{ matrix.node }}-

      - name: Prettier
        run: pnpm format:check

      - name: Lint, typecheck, test, build
        run: pnpm exec nx run-many -t lint typecheck test build --output-style=stream

  integration:
    name: ${{ matrix.node == 24 && 'integration tests (Testcontainers)' || 'integration tests (Testcontainers, Node 26)' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-node-${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-node-${{ matrix.node }}-

      # ubuntu-latest ships Docker, which Testcontainers uses to spin up Postgres + Redis.
      - name: Integration tests
        run: pnpm exec nx run-many -t test-integration --output-style=stream

  compatibility:
    name: official frontend SDKs and packed consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec nx run server-express:prepare-browser

      - name: Four official frontend SDKs
        run: pnpm exec nx run server-express:test-browser --output-style=stream

      - name: Packed SDK, MCP and A2A consumers
        run: pnpm exec nx run test-support:test-compatibility-consumer --output-style=stream

      - name: Packed native and BullMQ consumers
        run: pnpm exec nx run test-support:test-native-consumer --output-style=stream

  # Runs `packages/bench` for its **bounds**, never for its numbers.
  #
  # Same principle as `runtime-matrix` below: co-tenancy on a shared runner moves timings, not pass/fail.
  # So this gates only on integer facts about structures the harness probes — the per-stream SSE buffer
  # ceiling, the bus's retained-run and per-run frame caps, and that backpressure delayed frames rather
  # than dropping them (`harness/invariants.ts`, which names the phase behind each). Throughput and p99
  # are *reported* to the step summary and never asserted; the real performance measurement still belongs
  # on a machine nobody else is using (docs/profiling.md).
  #
  # This exists because P0–P16 shipped a series of bounds with nothing standing guard over them: a
  # regression in any of them showed up in no test, only in a number a human had to remember to look at.
  perf-bounds:
    name: perf bounds (bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-node-${{ env.NODE_LTS }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-node-${{ env.NODE_LTS }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-node-${{ env.NODE_LTS }}-

      # The memory driver only: it needs no containers, and every bound gated here belongs to the
      # in-process bus or the SSE write path. `nx bench` depends on `build`, so this measures this
      # commit's `dist` rather than a stale one — the trap PERF-WORKSTREAM.md's working notes record.
      # `pipefail` so `tee` cannot mask a failed bound — without it the pipeline reports tee's exit code
      # and a regression passes CI silently.
      - name: Bench (fails if a bound no longer holds)
        run: |
          set -o pipefail
          pnpm exec nx bench bench --output-style=stream -- --driver memory | tee bench.log

      # Published whether or not the bounds held, so a failure arrives with its numbers attached.
      - name: Publish measurements
        if: always()
        run: |
          {
            echo '### Performance bounds'
            echo
            echo 'Gated on bounds only — throughput and p99 are reported, never asserted.'
            echo
            sed -n '/^| scenario /,/^$/p' bench.log 2>/dev/null || echo '_no table produced_'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: packages/bench/results/latest.json
          if-no-files-found: warn

  # The correctness half of the Bun/Deno graduation matrix (PERF-WORKSTREAM.md, P12). Correctness is
  # what a shared runner can decide: co-tenancy moves timings, not pass/fail. The performance half
  # deliberately lives nowhere near CI — see docs/profiling.md for where it belongs and why.
  runtime-matrix:
    name: protocol conformance (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      # Every runtime and Node major reports independently.
      fail-fast: false
      matrix:
        include:
          - runtime: node
            node: 24
            label: node
          - runtime: node
            node: 26
            label: node 26
          - runtime: bun
            node: 24
            label: bun
          - runtime: deno
            node: 24
            label: deno
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: skein
          POSTGRES_DB: skein
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Node rows run both the harness and server on the selected major. Bun/Deno retain a Node 24 host.
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      # `skein start` runs the built CLI, so the build has to have happened first.
      - name: Build
        run: pnpm exec nx run-many -t build --output-style=stream

      - name: Protocol conformance
        env:
          POSTGRES_URI: postgresql://postgres:skein@127.0.0.1:5432/skein
          REDIS_URI: redis://127.0.0.1:6379
        run: node packages/test-support/scripts/runtime-conformance.mjs --runtime ${{ matrix.runtime }}

  # Builds the real production image per runtime and runs it under the 512Mi shape. The build alone
  # earns the job: it is what exercises the generated Dockerfile, its base image, its install step, and
  # the graph compatibility probe — where a malformed `deno eval` invocation was hiding.
  runtime-images:
    name: production image (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            label: node
          - runtime: node
            label: node 26
            runtime-version: "--runtime-version 26"
          - runtime: bun
            label: bun
          # Build-only: Deno's installer will not recurse into a vendored package's own `file:` deps, so
          # an image built from *unpublished* sources cannot boot. That is a property of substituting
          # local packages, not of the generated image — this runtime's serving behaviour is covered by
          # `runtime-matrix` above. Drop the flag once a prerelease is on npm.
          - runtime: deno
            label: deno
            build-only: "--build-only"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec nx run-many -t build --output-style=stream

      - name: Image smoke
        run: >-
          node scripts/runtime-image-smoke.mjs --runtime ${{ matrix.runtime }}
          ${{ matrix['runtime-version'] }}
          ${{ matrix['build-only'] }}

  # The job above builds a *committed* artifact, so it never runs the bundler. This one does: a real
  # `skein build` over a project fixture, then `docker build` on what it produced — the only coverage
  # of bundle → pinned package.json → install → graph compatibility probe as one chain. Issue #6 lived
  # in exactly that gap: the artifact pinned none of the packages the bundle imports.
  #
  # Node only, and not a matrix: bundling runs on the host under Node whatever runtime the image uses,
  # so a per-runtime axis here would cost time it cannot differ in.
  build-image:
    name: skein build → image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec nx run-many -t build --output-style=stream

      - name: Build smoke
        run: pnpm exec nx run test-support:test-build-image --output-style=stream

  # The on-ramp is a promise to strangers ("one command gets you a running agent"), and it can rot
  # without anything in this repo changing — a released dependency moves and the starter no longer
  # resolves or no longer typechecks. Unit tests assert what the scaffolder *returns*; only this
  # proves the result actually installs and serves a run.
  scaffold-smoke:
    name: npm create skein-js → running server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the scaffolder
        run: pnpm exec nx build create-skein-js --output-style=stream

      - name: Scaffold, install, and serve a run
        run: node scripts/scaffold-smoke.mjs

  scaffold-pack:
    name: pack current-commit scaffold artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.catalog.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run test-support:pack-scaffolds --output-style=stream
      - id: catalog
        run: echo "matrix=$(cat dist/scaffold-packs/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-packages
          path: dist/scaffold-packs
          if-no-files-found: error

  scaffold-consumers:
    name: scaffold consumer (${{ matrix.id }}, Node ${{ matrix.node }})
    needs: scaffold-pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scaffold-pack.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      # Node 26 does not bundle Corepack. Its private bin directory also contains pnpm shims,
      # so expose only Yarn and preserve pnpm/action-setup's pinned binary.
      - name: Prepare Yarn without replacing pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/skein-corepack" --no-audit --no-fund corepack@0.34.0
          mkdir -p "$RUNNER_TEMP/skein-yarn-bin"
          node "$RUNNER_TEMP/skein-corepack/node_modules/corepack/dist/corepack.js" enable yarn --install-directory "$RUNNER_TEMP/skein-yarn-bin"
          node "$RUNNER_TEMP/skein-corepack/node_modules/corepack/dist/corepack.js" prepare yarn@4.9.2 --activate
          echo "$RUNNER_TEMP/skein-yarn-bin" >> "$GITHUB_PATH"
      - name: Verify package managers
        working-directory: ${{ runner.temp }}
        run: |
          test "$(pnpm --version)" = "9.15.0"
          test "$(yarn --version)" = "4.9.2"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: scaffold-packages
          path: dist/scaffold-packs
      - name: Prepare pinned npm for packed consumers
        run: pnpm exec nx run test-support:prepare-scaffold-managers --directory="${{ runner.temp }}/skein-scaffold-tools"
      - name: Install and exercise consumer
        env:
          SKEIN_CONSUMER_NPM_CLI: ${{ runner.temp }}/skein-scaffold-tools/node_modules/npm/bin/npm-cli.js
        run: |
          set -o pipefail
          pnpm exec nx run test-support:scaffold-consumers --case=${{ matrix.id }} --output-style=stream 2>&1 | tee scaffold-consumer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaffold-log-${{ matrix.id }}
          path: scaffold-consumer.log
          if-no-files-found: error
