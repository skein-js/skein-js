<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>skein console</title>
    <script>
      // Apply the stored theme before first paint. Without this the page renders light, then React
      // mounts and flips it — a white flash on every navigation to a dark console.
      (function () {
        try {
          var stored = localStorage.getItem("skein-console:theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          /* localStorage can throw in private modes; the default light theme is a fine fallback. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
